[pytest]
# Anchors pytest's rootdir to code/ so it doesn't pick up the repo-root
# pyproject.toml (which is for the docs site, not for tests).
#
# Point straight at the test directories: gateway/ has no tests, and listing
# source packages just makes pytest crawl files that can never match test*.py.
testpaths = tests trimmer/tests cache/tests autopilot/tests
