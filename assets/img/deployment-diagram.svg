  <!-- ================= notes and notation ================= -->
  <rect class="panel" x="40" y="866" width="1480" height="280" rx="8"/>
  <text class="bold" x="60" y="896">Notes</text>
  <text class="small" x="60" y="922">•  Mock mode: with MOCK_PROVIDER=1 or no PROVIDER_API_KEY, the gateway answers locally and never contacts the LLM provider, so the whole pipeline runs offline at no cost.</text>
  <text class="small" x="60" y="946">•  Base URL: a coding agent connects by pointing its base URL at http://localhost:8000/v1. The built-in dashboard needs no separate server: GET / serves dashboard.html from the same process.</text>
  <text class="small" x="60" y="970">•  State: the cache and metrics live inside the single uvicorn process. They are not shared between workers and do not survive a restart. A persistent or shared store is future work.</text>
  <text class="small" x="60" y="994">•  Environment: the code reads settings with os.getenv and does not load .env by itself; export them or pass uvicorn --env-file .env.</text>
  <text class="small" x="60" y="1018">•  Offline fallbacks: with no tiktoken download, count_tokens falls back to len/4. Without sentence-transformers, the cache still matches exact text and only prose similarity is off.</text>
  <text class="small" x="60" y="1042">•  demo.py runs in process through FastAPI TestClient with the mock provider, so it needs no running server and is not a separate deployment.</text>
  <text class="small" x="60" y="1066">•  Not deployed: the cache uses no database or vector store such as SQLite or FAISS; entries stay in process memory. No Dockerfile, compose file or hosted gateway exists in the repository.</text>
  <text class="bold" x="60" y="1122">Notation</text>
  <path class="plain" d="M130 1112 l6 -6 h24 v14 l-6 6 Z"/>
