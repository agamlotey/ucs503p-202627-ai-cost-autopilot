  <rect class="bg" width="1560" height="1180"/>
  <text class="head" x="780.0" y="48" text-anchor="middle">Deployment Diagram — AI Cost Autopilot</text>
  <text class="subt" x="780.0" y="74" text-anchor="middle">What the repository actually deploys today: one local gateway process per developer. There is no container image or hosted production gateway.</text>

