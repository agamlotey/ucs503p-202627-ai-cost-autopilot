<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1180" width="1560" height="1180" role="img" aria-labelledby="t d">
  <title id="t">UML deployment diagram for AI Cost Autopilot</title>
  <desc id="d">The developer workstation hosts the coding agent, a browser, the Python uvicorn process that runs the gateway with its in-memory cache and metrics, and an optional Vite dev server for the React dashboard. The gateway calls the LLM provider over HTTPS when a key is set. Model hosts supply tiktoken and embedding files on first use. GitHub hosts the repository, Actions runners for tests and docs, and the Pages documentation site.</desc>

