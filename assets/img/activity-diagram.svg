<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1680" width="1500" height="1680" role="img" aria-labelledby="t d" font-family='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif'>
  <title id="t">Activity diagram with swimlanes for handling a coding request</title>
  <desc id="d">The coding agent sends a request. The gateway snapshots it and computes signals in parallel. The autopilot decides whether to use the cache; on a cache hit the stored response is returned. Otherwise the autopilot decides whether to trim, the trimmer keeps the focus and its callees, the request is forwarded to the LLM provider, and the response is stored and metrics recorded in parallel before it is returned to the agent.</desc>
