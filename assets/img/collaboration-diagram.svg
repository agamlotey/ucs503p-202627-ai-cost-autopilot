<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1136" width="1560" height="1136" role="img" aria-labelledby="t d">
  <title id="t">UML collaboration (communication) diagram for AI Cost Autopilot</title>
  <desc id="d">The gateway object sits at the centre, linked to the coding agent, the dashboard, the autopilot and its secrets detector, the semantic cache, the code trimmer, the provider module with the LLM provider, and the metrics object. Numbered messages along the links show one chat completion with a cache miss, its cache-hit alternative, and the dashboard polling for statistics.</desc>

  <style>
    .bg    { fill:#ffffff }
    .box   { fill:#fff4d6; stroke:#1f2328; stroke-width:1.6 }
    .ext   { fill:#f7f4ee; stroke:#1f2328; stroke-width:1.6 }
    .plain { fill:#ffffff; stroke:#1f2328; stroke-width:1.6 }
    .frame { fill:none; stroke:#1f2328; stroke-width:1.4 }
    .tag   { fill:#f7f4ee; stroke:#1f2328; stroke-width:1.4 }
    .sep   { stroke:#1f2328; stroke-width:1.2; fill:none }
    .line  { stroke:#1f2328; stroke-width:1.5; fill:none }
    .dash  { stroke:#1f2328; stroke-width:1.5; fill:none; stroke-dasharray:7 5 }
    .life  { stroke:#6b7280; stroke-width:1.2; fill:none; stroke-dasharray:5 5 }
    .bar   { fill:#ffffff; stroke:#1f2328; stroke-width:1.3 }
    .panel { fill:#f7f4ee; stroke:#d8d3c7; stroke-width:1.2 }
    .note  { fill:#fffdf5; stroke:#1f2328; stroke-width:1.1 }
    .wash  { fill:#ffffff; opacity:.93 }
    .head  { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#111111; font-size:25px; font-weight:700 }
    .subt  { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#555555; font-size:14px }
    .name  { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#111111; font-size:14px; font-weight:700 }
    .ste   { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#555555; font-size:12px; font-style:italic }
    .mem   { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#111111; font-size:12px; white-space:pre }
    .txt   { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#111111; font-size:13px }
    .small { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#555555; font-size:12px }
    .lbl   { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#111111; font-size:12px; font-style:italic }
    .msg   { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#111111; font-size:12px; white-space:pre }
    .bold  { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#111111; font-size:13px; font-weight:700 }
  </style>

  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="10.5" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1.5 1.5 L10.5 6 L1.5 10.5" fill="none" stroke="#1f2328" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="fill" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1.5 L11 6 L1 10.5 Z" fill="#1f2328" stroke="#1f2328" stroke-width="1"/>
    </marker>
    <marker id="tri" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M1 1.5 L15 8 L1 14.5 Z" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <marker id="dia" viewBox="0 0 20 12" refX="19" refY="6" markerWidth="16" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 6 L10 1 L19 6 L10 11 Z" fill="#1f2328" stroke="#1f2328" stroke-width="1"/>
    </marker>
  </defs>

  <rect class="bg" width="1560" height="1136"/>
  <text class="head" x="780.0" y="48" text-anchor="middle">Collaboration Diagram — AI Cost Autopilot</text>
  <text class="subt" x="780.0" y="74" text-anchor="middle">The same chat completion as the sequence diagram, organised by who is linked to whom. Decimal numbers give the order and nesting of messages.</text>

  <!-- ================= links ================= -->
  <path class="line" d="M230 460 L640 460"/>
  <path class="line" d="M230 800 L330 800 L330 540 L640 540"/>
  <path class="line" d="M470 198 L470 350 L650 350 L650 440"/>
  <path class="line" d="M240 170 L370 170"/>
  <path class="line" d="M910 440 L910 350 L1090 350 L1090 198"/>
  <path class="line" d="M920 500 L1300 500"/>
  <path class="line" d="M880 560 L880 680 L1060 680"/>
  <path class="line" d="M1160 708 L1160 852"/>
  <path class="line" d="M780 560 L780 772"/>

  <!-- ================= objects ================= -->
  <rect class="box" x="640.0" y="440.0" width="280" height="120" rx="3"/>
  <text class="name" x="780" y="496" text-anchor="middle">gateway</text>
  <path class="sep" d="M754 499 H806"/>
  <text class="ste" x="780" y="516" text-anchor="middle">:app.chat_completions()</text>
  <rect class="ext" x="30.0" y="432.0" width="200" height="56" rx="3"/>
  <text class="name" x="130" y="456" text-anchor="middle">agent</text>
  <path class="sep" d="M112 459 H148"/>
  <text class="ste" x="130" y="476" text-anchor="middle">:Coding Agent  «external»</text>
  <rect class="ext" x="30.0" y="772.0" width="200" height="56" rx="3"/>
  <text class="name" x="130" y="796" text-anchor="middle">dashboard</text>
  <path class="sep" d="M97 799 H163"/>
  <text class="ste" x="130" y="816" text-anchor="middle">:Dashboard (browser)</text>
  <rect class="box" x="370.0" y="142.0" width="200" height="56" rx="3"/>
  <text class="name" x="470" y="166" text-anchor="middle">autopilot</text>
  <path class="sep" d="M437 169 H503"/>
  <text class="ste" x="470" y="186" text-anchor="middle">:Autopilot</text>
  <rect class="box" x="20.0" y="142.0" width="220" height="56" rx="3"/>
  <text class="name" x="130" y="166" text-anchor="middle">_secrets</text>
  <path class="sep" d="M100 169 H160"/>
  <text class="ste" x="130" y="186" text-anchor="middle">:SecretsDetector</text>
  <rect class="box" x="980.0" y="142.0" width="220" height="56" rx="3"/>
  <text class="name" x="1090" y="166" text-anchor="middle">cache</text>
  <path class="sep" d="M1072 169 H1108"/>
  <text class="ste" x="1090" y="186" text-anchor="middle">:SemanticCache</text>
  <rect class="box" x="1300.0" y="472.0" width="200" height="56" rx="3"/>
  <text class="name" x="1400" y="496" text-anchor="middle">trimmer</text>
  <path class="sep" d="M1374 499 H1426"/>
  <text class="ste" x="1400" y="516" text-anchor="middle">:CodeTrimmer</text>
  <rect class="box" x="1060.0" y="652.0" width="200" height="56" rx="3"/>
