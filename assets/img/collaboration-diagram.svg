  <path class="sep" d="M1130 679 H1190"/>
  <text class="ste" x="1160" y="696" text-anchor="middle">«module» gateway.provider</text>
  <rect class="ext" x="1030.0" y="852.0" width="260" height="56" rx="3"/>
  <text class="name" x="1160" y="876" text-anchor="middle">llm</text>
  <path class="sep" d="M1149 879 H1171"/>
  <text class="ste" x="1160" y="896" text-anchor="middle">:LLM Provider  «external»</text>
  <rect class="box" x="680.0" y="772.0" width="200" height="56" rx="3"/>
  <text class="name" x="780" y="796" text-anchor="middle">metrics</text>
  <path class="sep" d="M754 799 H806"/>
  <text class="ste" x="780" y="816" text-anchor="middle">:Metrics</text>

  <!-- ================= messages along the links ================= -->
  <rect class="wash" x="243" y="389" width="282" height="18"/>
  <path class="line" d="M246 398 L268 398" marker-end="url(#fill)"/>
  <text class="msg" x="276" y="402">1: POST /v1/chat/completions(body)</text>
  <rect class="wash" x="243" y="409" width="166" height="18"/>
  <path class="line" d="M268 418 L246 418" marker-end="url(#fill)"/>
  <text class="msg" x="276" y="422">1.10: 200 response</text>
  <rect class="wash" x="243" y="429" width="261" height="18"/>
  <path class="line" d="M268 438 L246 438" marker-end="url(#fill)"/>
  <text class="msg" x="276" y="442">1.7a [hit]: 200 stored response</text>
  <path class="line" d="M740 440 L740 412 L820 412 L820 440" marker-end="url(#fill)"/>
  <text class="msg" x="780" y="348" text-anchor="middle">1.1: deepcopy(body): original</text>
  <text class="msg" x="780" y="368" text-anchor="middle">1.2: _tokens(), _preview()</text>
  <text class="msg" x="780" y="388" text-anchor="middle">1.3: compute_signals(original)</text>
  <rect class="wash" x="483" y="267" width="297" height="18"/>
  <path class="line" d="M497 283 L497 268" marker-end="url(#fill)"/>
  <text class="msg" x="516" y="280">1.4: decide(original, signals): plan</text>
  <rect class="wash" x="147" y="115" width="254" height="18"/>
  <path class="line" d="M172 124 L150 124" marker-end="url(#fill)"/>
  <text class="msg" x="180" y="128">1.4.1: scan(text): has_secrets</text>
  <rect class="wash" x="1103" y="249" width="348" height="18"/>
  <path class="line" d="M1117 265 L1117 250" marker-end="url(#fill)"/>
  <text class="msg" x="1136" y="262">1.5 [plan.use_cache]: lookup(original): hit</text>
  <rect class="wash" x="1103" y="271" width="420" height="18"/>
  <path class="line" d="M1117 287 L1117 272" marker-end="url(#fill)"/>
  <text class="msg" x="1136" y="284">1.8 [plan.use_cache, miss]: store(original, response)</text>
  <rect class="wash" x="933" y="451" width="196" height="18"/>
  <path class="line" d="M936 460 L958 460" marker-end="url(#fill)"/>
  <text class="msg" x="966" y="464">1.6 [plan.trim, miss]:</text>
  <rect class="wash" x="963" y="471" width="333" height="18"/>
  <text class="msg" x="996" y="484">trim(messages, budget, {}): (msgs, stats)</text>
  <rect class="wash" x="893" y="607" width="290" height="18"/>
  <path class="line" d="M907 608 L907 623" marker-end="url(#fill)"/>
  <text class="msg" x="926" y="620">1.7 [miss]: forward(body): response</text>
  <rect class="wash" x="1173" y="767" width="297" height="18"/>
  <path class="line" d="M1187 768 L1187 783" marker-end="url(#fill)"/>
  <text class="msg" x="1206" y="780">1.7.1 [live]: POST /chat/completions</text>
  <path class="line" d="M1260 665 L1292 665 L1292 695 L1260 695" marker-end="url(#fill)"/>
  <rect class="wash" x="1267" y="711" width="275" height="18"/>
  <text class="msg" x="1300" y="724">1.7.1 [mock]: mock_response(body)</text>
  <rect class="wash" x="368" y="627" width="398" height="18"/>
  <path class="line" d="M382.5 628 L382.5 643" marker-end="url(#fill)"/>
  <text class="msg" x="401.5" y="640">1.6a [hit]: record(baseline, sent=0, "cache", ...)</text>
  <rect class="wash" x="354" y="649" width="413" height="18"/>
  <path class="line" d="M368.0 650 L368.0 665" marker-end="url(#fill)"/>
  <text class="msg" x="387.0" y="662">1.9: record(baseline, sent, outcome, model, preview)</text>
  <rect class="wash" x="506" y="671" width="261" height="18"/>
  <path class="line" d="M520.25 672 L520.25 687" marker-end="url(#fill)"/>
  <text class="msg" x="539.25" y="684">2.1: snapshot(): totals, recent</text>
  <rect class="wash" x="333" y="493" width="239" height="18"/>
  <path class="line" d="M336 502 L358 502" marker-end="url(#fill)"/>
  <text class="msg" x="366" y="506">2 *[every 1.5 s]: GET /stats</text>
  <rect class="wash" x="333" y="513" width="304" height="18"/>
  <path class="line" d="M336 522 L358 522" marker-end="url(#fill)"/>
  <text class="msg" x="366" y="526">3 [Try it]: POST /v1/chat/completions</text>

  <!-- ================= notation ================= -->
  <rect class="panel" x="40" y="940" width="1480" height="170" rx="8"/>
  <text class="bold" x="60" y="970">How to read it</text>
  <text class="small" x="60" y="994">Boxes are objects (name : class, underlined). A line is a link: the objects can reach each other. The small arrow before each message gives its direction.</text>
  <text class="small" x="60" y="1016">Numbers nest: 1.4.1 runs inside 1.4. On a cache hit, 1.6a and 1.7a replace 1.6 to 1.10, so no trim and no provider call happen. Message 3 then repeats the 1.x messages.</text>
  <text class="small" x="60" y="1038">Guards in [ ] must hold for the message to be sent. * means repeated. A return value follows a colon, as in lookup(original): hit.</text>
  <text class="small" x="60" y="1060">Secret detected: plan.use_cache is False, so 1.5 and 1.8 are skipped; 1.6 can still run when the request is code-heavy and over the 1000-token threshold.</text>
  <text class="small" x="60" y="1082">The cache is keyed on the original request (1.1), never the trimmed one, so a trimmed request can still be reused later.</text>
</svg>
