<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" width="1080" height="760" role="img" aria-labelledby="t d">
  <title id="t">UML use case diagram for AI Cost Autopilot</title>
  <desc id="d">Actors are the Developer, the Coding Agent, the Maintainer and the LLM Provider. Use cases inside the system boundary include sending a coding request, reducing token cost, reusing a previous answer, reducing code context, selecting the cheapest safe action, reporting savings, configuring the gateway and running the benchmark.</desc>
  <style>
    .bg{fill:#ffffff}
    .uc{fill:#fff6de;stroke:#e0a800;stroke-width:2}
    .sys{fill:none;stroke:#8a5200;stroke-width:2.2}
    .actor{stroke:#8a5200;stroke-width:2;fill:none}
    .lbl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#1f2328;font-size:14px}
    .name{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#1f2328;font-size:14px;font-weight:700}
    .head{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#8a5200;font-size:22px;font-weight:700}
    .ste{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;fill:#8a5200;font-size:12px;font-style:italic}
    .rel{stroke:#8a5200;stroke-width:1.5;fill:none}
    .dep{stroke:#8a5200;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
  </style>
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#8a5200" stroke-width="1.6"/>
    </marker>
  </defs>
  <rect class="bg" width="1080" height="760"/>
  <text class="head" x="540" y="36" text-anchor="middle">Use Case Diagram — AI Cost Autopilot</text>

  <!-- system boundary -->
  <rect class="sys" x="300" y="70" width="500" height="640" rx="8"/>
  <text class="name" x="550" y="98" text-anchor="middle" fill="#8a5200">AI Cost Autopilot Gateway</text>

  <!-- actors -->
  <g transform="translate(120,180)">
    <circle class="actor" cx="0" cy="-26" r="13"/>
    <line class="actor" x1="0" y1="-13" x2="0" y2="16"/>
    <line class="actor" x1="-16" y1="-2" x2="16" y2="-2"/>
    <line class="actor" x1="0" y1="16" x2="-13" y2="38"/>
    <line class="actor" x1="0" y1="16" x2="13" y2="38"/>
    <text class="name" x="0" y="58" text-anchor="middle">Developer</text>
  </g>

  <g transform="translate(120,400)">
    <rect class="actor" x="-46" y="-30" width="92" height="52" rx="5"/>
    <text class="name" x="0" y="-8" text-anchor="middle" font-size="13">Coding</text>
    <text class="name" x="0" y="10" text-anchor="middle" font-size="13">Agent</text>
    <text class="ste"  x="0" y="40" text-anchor="middle">&#171;system&#187;</text>
  </g>

  <g transform="translate(120,600)">
    <circle class="actor" cx="0" cy="-26" r="13"/>
    <line class="actor" x1="0" y1="-13" x2="0" y2="16"/>
    <line class="actor" x1="-16" y1="-2" x2="16" y2="-2"/>
    <line class="actor" x1="0" y1="16" x2="-13" y2="38"/>
    <line class="actor" x1="0" y1="16" x2="13" y2="38"/>
    <text class="name" x="0" y="58" text-anchor="middle">Maintainer</text>
  </g>

  <g transform="translate(960,400)">
    <rect class="actor" x="-52" y="-30" width="104" height="52" rx="5"/>
    <text class="name" x="0" y="-8" text-anchor="middle" font-size="13">LLM</text>
    <text class="name" x="0" y="10" text-anchor="middle" font-size="13">Provider</text>
    <text class="ste"  x="0" y="40" text-anchor="middle">&#171;system&#187;</text>
  </g>

  <!-- use cases -->
  <ellipse class="uc" cx="470" cy="160" rx="130" ry="34"/>
  <text class="lbl" x="470" y="165" text-anchor="middle">Send coding request</text>

  <ellipse class="uc" cx="470" cy="260" rx="130" ry="34"/>
  <text class="lbl" x="470" y="265" text-anchor="middle">Reduce token cost</text>

  <ellipse class="uc" cx="660" cy="360" rx="120" ry="34"/>
  <text class="lbl" x="660" y="365" text-anchor="middle">Reuse past answer</text>

  <ellipse class="uc" cx="660" cy="452" rx="120" ry="34"/>
  <text class="lbl" x="660" y="457" text-anchor="middle">Reduce code context</text>

  <ellipse class="uc" cx="440" cy="406" rx="118" ry="34"/>
  <text class="lbl" x="440" y="411" text-anchor="middle">Select cheapest</text>
  <text class="lbl" x="440" y="399" text-anchor="middle" font-size="0"> </text>

  <ellipse class="uc" cx="470" cy="546" rx="130" ry="34"/>
  <text class="lbl" x="470" y="551" text-anchor="middle">Report savings</text>

  <ellipse class="uc" cx="470" cy="640" rx="130" ry="34"/>
  <text class="lbl" x="470" y="645" text-anchor="middle">Configure gateway</text>

  <ellipse class="uc" cx="690" cy="640" rx="95" ry="34"/>
  <text class="lbl" x="690" y="645" text-anchor="middle">Run benchmark</text>

  <!-- associations -->
  <line class="rel" x1="160" y1="176" x2="342" y2="162"/>
  <line class="rel" x1="166" y1="392" x2="342" y2="266"/>
  <line class="rel" x1="166" y1="404" x2="322" y2="406"/>
  <line class="rel" x1="160" y1="586" x2="342" y2="644"/>
  <line class="rel" x1="160" y1="596" x2="352" y2="560"/>
  <line class="rel" x1="166" y1="612" x2="596" y2="646"/>
  <line class="rel" x1="780" y1="452" x2="908" y2="412"/>

  <!-- include / extend -->
  <path class="dep" d="M540 282 L 560 340" marker-end="url(#open)"/>
  <text class="ste" x="590" y="312" text-anchor="middle">&#171;include&#187;</text>

  <path class="dep" d="M470 294 L 440 370" marker-end="url(#open)"/>
  <text class="ste" x="380" y="336" text-anchor="middle">&#171;include&#187;</text>

  <path class="dep" d="M552 424 L 542 448" marker-end="url(#open)"/>
  <text class="ste" x="500" y="470" text-anchor="middle">&#171;include&#187;</text>

  <path class="dep" d="M470 194 L 470 224" marker-end="url(#open)"/>
  <text class="ste" x="524" y="214" text-anchor="middle">&#171;extend&#187;</text>

  <path class="dep" d="M660 486 L 520 528" marker-end="url(#open)"/>
  <text class="ste" x="620" y="516" text-anchor="middle">&#171;include&#187;</text>

  <!-- legend -->
  <g transform="translate(830,600)">
    <text class="lbl" x="0" y="0" font-weight="700" font-size="13">Notation</text>
    <ellipse class="uc" cx="16" cy="22" rx="16" ry="10"/>
    <text class="lbl" x="42" y="26" font-size="12">use case</text>
    <line class="rel" x1="0" y1="52" x2="32" y2="52"/>
    <text class="lbl" x="42" y="56" font-size="12">association</text>
    <path class="dep" d="M0 80 L 32 80" marker-end="url(#open)"/>
    <text class="lbl" x="42" y="84" font-size="12">include / extend</text>
  </g>
</svg>
