<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="t d">
  <title id="t">UML use case diagram for AI Cost Autopilot</title>
  <desc id="d">The Developer and the Coding Agent send coding requests. Sending a request always includes reducing token cost, which always includes selecting the cheapest safe action and reporting savings. Reusing a past answer, reducing code context and obtaining a completion from the LLM provider each conditionally extend the selection step. The Maintainer configures the gateway and runs the benchmark.</desc>

  <style>
    .bg    { fill:#0b0b0e }
    .sys   { fill:#101015; stroke:#ffc107; stroke-width:2.2 }
    .uc    { fill:#1d1810; stroke:#ffc107; stroke-width:2 }
    .act   { stroke:#ffc107; stroke-width:2; fill:none }
    .actbox{ fill:#17151a; stroke:#ffc107; stroke-width:2 }
    .name  { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#f2ece0; font-size:14px; font-weight:700 }
    .uct   { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#f2ece0; font-size:14px }
    .sub   { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#9d958a; font-size:12px }
    .ste   { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#ffc107; font-size:12px; font-style:italic }
    .head  { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#ffc107; font-size:26px; font-weight:700 }
    .boxt  { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; fill:#ffc107; font-size:15px; font-weight:700 }
    .assoc { stroke:#ffc107; stroke-width:1.6; fill:none }
    .dep   { stroke:#ffc107; stroke-width:1.6; fill:none; stroke-dasharray:7 5 }
  </style>

  <defs>
    <marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#ffc107" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="880"/>
  <text class="head" x="600" y="46" text-anchor="middle">Use Case Diagram — AI Cost Autopilot</text>

  <!-- system boundary -->
  <rect class="sys" x="340" y="88" width="520" height="740" rx="10"/>
  <text class="boxt" x="600" y="120" text-anchor="middle">AI Cost Autopilot Gateway</text>

  <!-- ============ actors ============ -->
  <g transform="translate(170,200)">
    <circle class="act" cx="0" cy="-30" r="14"/>
    <line class="act" x1="0" y1="-16" x2="0" y2="16"/>
    <line class="act" x1="-18" y1="-4" x2="18" y2="-4"/>
    <line class="act" x1="0" y1="16" x2="-14" y2="40"/>
    <line class="act" x1="0" y1="16" x2="14" y2="40"/>
    <text class="name" x="0" y="62" text-anchor="middle">Developer</text>
  </g>

  <g transform="translate(170,400)">
    <rect class="actbox" x="-58" y="-30" width="116" height="54" rx="5"/>
    <text class="name" x="0" y="-8" text-anchor="middle">Coding Agent</text>
    <text class="sub"  x="0" y="12" text-anchor="middle">Cursor / Codex</text>
    <text class="ste"  x="0" y="42" text-anchor="middle">&#171;system&#187;</text>
  </g>

  <g transform="translate(170,690)">
    <circle class="act" cx="0" cy="-30" r="14"/>
    <line class="act" x1="0" y1="-16" x2="0" y2="16"/>
    <line class="act" x1="-18" y1="-4" x2="18" y2="-4"/>
    <line class="act" x1="0" y1="16" x2="-14" y2="40"/>
    <line class="act" x1="0" y1="16" x2="14" y2="40"/>
    <text class="name" x="0" y="62" text-anchor="middle">Maintainer</text>
  </g>

  <g transform="translate(1030,470)">
    <rect class="actbox" x="-58" y="-30" width="116" height="54" rx="5"/>
    <text class="name" x="0" y="-8" text-anchor="middle">LLM Provider</text>
    <text class="sub"  x="0" y="12" text-anchor="middle">OpenAI / Anthropic</text>
    <text class="ste"  x="0" y="42" text-anchor="middle">&#171;system&#187;</text>
  </g>

  <!-- ============ use cases ============ -->
  <ellipse class="uc" cx="500" cy="180" rx="115" ry="32"/>
  <text class="uct" x="500" y="185" text-anchor="middle">Send coding request</text>

  <ellipse class="uc" cx="500" cy="280" rx="115" ry="32"/>
  <text class="uct" x="500" y="285" text-anchor="middle">Reduce token cost</text>

  <ellipse class="uc" cx="500" cy="420" rx="115" ry="32"/>
  <text class="uct" x="500" y="416" text-anchor="middle">Select cheapest</text>
  <text class="uct" x="500" y="434" text-anchor="middle">safe action</text>

  <ellipse class="uc" cx="500" cy="560" rx="115" ry="32"/>
  <text class="uct" x="500" y="565" text-anchor="middle">Report savings</text>

  <ellipse class="uc" cx="500" cy="680" rx="115" ry="32"/>
  <text class="uct" x="500" y="685" text-anchor="middle">Configure gateway</text>

  <ellipse class="uc" cx="500" cy="770" rx="115" ry="32"/>
  <text class="uct" x="500" y="775" text-anchor="middle">Run benchmark</text>

  <ellipse class="uc" cx="730" cy="360" rx="105" ry="32"/>
  <text class="uct" x="730" y="365" text-anchor="middle">Reuse past answer</text>

  <ellipse class="uc" cx="730" cy="470" rx="105" ry="32"/>
  <text class="uct" x="730" y="466" text-anchor="middle">Reduce code</text>
  <text class="uct" x="730" y="484" text-anchor="middle">context</text>

  <ellipse class="uc" cx="730" cy="580" rx="105" ry="32"/>
  <text class="uct" x="730" y="585" text-anchor="middle">Obtain completion</text>

  <!-- ============ associations (plain lines, no arrowheads in UML) ============ -->
  <line class="assoc" x1="205" y1="186" x2="387" y2="176"/>
  <line class="assoc" x1="230" y1="380" x2="392" y2="200"/>
  <line class="assoc" x1="205" y1="672" x2="386" y2="674"/>
  <line class="assoc" x1="205" y1="700" x2="392" y2="758"/>
  <line class="assoc" x1="971" y1="486" x2="838" y2="570"/>

  <!-- ============ include: the base always performs the included case ============ -->
  <path class="dep" d="M500 212 L 500 246" marker-end="url(#open)"/>
  <text class="ste" x="560" y="234" text-anchor="middle">&#171;include&#187;</text>

  <path class="dep" d="M500 312 L 500 386" marker-end="url(#open)"/>
  <text class="ste" x="560" y="354" text-anchor="middle">&#171;include&#187;</text>

  <path class="dep" d="M500 452 L 500 526" marker-end="url(#open)"/>
  <text class="ste" x="560" y="494" text-anchor="middle">&#171;include&#187;</text>

  <!-- ============ extend: the extension conditionally adds to the base,
                    so the arrow points FROM the extension TO the base ============ -->
  <path class="dep" d="M628 378 L 604 400" marker-end="url(#open)"/>
  <text class="ste" x="655" y="404" text-anchor="middle">&#171;extend&#187;</text>

  <path class="dep" d="M625 462 L 617 436" marker-end="url(#open)"/>
  <text class="ste" x="660" y="432" text-anchor="middle">&#171;extend&#187;</text>

  <path class="dep" d="M662 558 L 574 452" marker-end="url(#open)"/>
  <text class="ste" x="655" y="512" text-anchor="middle">&#171;extend&#187;</text>

  <!-- ============ legend ============ -->
  <g transform="translate(900,660)">
    <rect x="0" y="0" width="270" height="150" rx="8" fill="#101015" stroke="#2f2a22" stroke-width="1.4"/>
    <text class="name" x="18" y="30" font-size="13">Notation</text>
    <ellipse class="uc" cx="36" cy="58" rx="20" ry="12"/>
    <text class="sub" x="70" y="62">use case</text>
    <line class="assoc" x1="16" y1="92" x2="56" y2="92"/>
    <text class="sub" x="70" y="96">association</text>
    <path class="dep" d="M16 124 L 56 124" marker-end="url(#open)"/>
    <text class="sub" x="70" y="128">include / extend</text>
  </g>

  <!-- semantics note -->
  <g transform="translate(900,120)">
    <rect x="0" y="0" width="270" height="180" rx="8" fill="#101015" stroke="#2f2a22" stroke-width="1.4"/>
    <text class="name" x="18" y="30" font-size="13">Reading the arrows</text>
    <text class="sub" x="18" y="58">&#171;include&#187; — the base case</text>
    <text class="sub" x="18" y="78">always performs it. Arrow</text>
    <text class="sub" x="18" y="98">points base &#8594; included.</text>
    <text class="sub" x="18" y="126">&#171;extend&#187; — conditional</text>
    <text class="sub" x="18" y="146">behaviour. Arrow points</text>
    <text class="sub" x="18" y="166">extension &#8594; base.</text>
  </g>
</svg>
