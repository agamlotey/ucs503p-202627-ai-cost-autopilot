  <title id="t">Entity relationship diagram for AI Cost Autopilot</title>
  <desc id="d">Chen-notation conceptual data model. A Request is logged as one Metric Record, is forwarded to one LLM Model, may reuse one Cache Entry, and includes many Source Files. A Source File defines many Functions, and Functions call other Functions.</desc>
